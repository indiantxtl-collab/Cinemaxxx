name: Android CI

# Builds the signed, installable cinemaxxx APK on every push and pull request.
#
# The Android app in this repository is deliberately Gradle-free (see
# android/README.md): there is no gradlew, no settings.gradle and no Android SDK
# manager involved. The whole toolchain is pinned and checksum-verified by
# android/tools/fetch-toolchain.sh, so the build runs the same command here as it
# does on a developer machine:
#
#   bash android/build.sh              -> android/dist/cinemaxxx-1.1.0.apk
#   bash android/build.sh --debug      -> android/dist/cinemaxxx-1.1.0-debug.apk
#   bash android/tests/run-tests.sh    -> JVM + JS + DOM + artwork + APK checks
#
# The finished APK is uploaded as a downloadable artifact.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The DOM layer must really run in CI: jsdom is installed below, and a missing
  # jsdom is treated as a failure instead of a silent skip.
  CINEMAXXX_REQUIRE_JSDOM: "1"
  # The app's own origin. The repository variable wins when it is set; otherwise
  # the project's domain is used, so a fresh fork still builds the right origin.
  CINEMAXXX_SITE_URL: ${{ vars.CINEMAXXX_SITE_URL || 'https://cinemaxxx.cinemaxtv.space' }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.CINEMAXXX_SITE_URL || 'https://cinemaxxx.cinemaxtv.space' }}

jobs:
  apk:
    name: Build and verify the signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Restore the pinned Android toolchain
        uses: actions/cache@v6
        with:
          path: android/.toolchain
          key: cinemaxxx-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/tools/fetch-toolchain.sh') }}
          restore-keys: |
            cinemaxxx-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch the pinned Android toolchain (aapt2, d8, ecj, apksigner, JRE)
        run: bash android/tools/fetch-toolchain.sh

      - name: Install the test dependency used by the DOM layer (jsdom)
        run: bash android/tests/install-test-deps.sh

      # The debug variant is built first on purpose: android/build.sh wipes
      # android/build/ each run, so the release build below must be the last one
      # to touch it (the test log and the splash preview are written afterwards).
      # Release signing needs four repository secrets. With none of them set, the
      # job still builds, signs (debug key) and tests the APK, and says so in the
      # job summary. A partial set is a configuration error and fails the job.
      - name: Decide the signing path (release secrets or debug-only)
        env:
          KEYSTORE_BASE64: ${{ secrets.CINEMAXXX_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CINEMAXXX_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.CINEMAXXX_STORE_PASS }}
          KEY_PASS: ${{ secrets.CINEMAXXX_KEY_PASS }}
        run: |
          test -n "$CINEMAXXX_SITE_URL" || { echo '::error::the deployment origin is empty'; exit 1; }
          set_count=0
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASS KEY_PASS; do
            if [ -n "${!name:-}" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -eq 0 ]; then
            echo "RELEASE_SIGNING=0" >> "$GITHUB_ENV"
            {
              echo "### Release APK not built"
              echo "The repository has no release-signing secrets (CINEMAXXX_KEYSTORE_BASE64, CINEMAXXX_KEY_ALIAS, CINEMAXXX_KEY_PASS, CINEMAXXX_STORE_PASS)."
              echo "This run builds, signs and tests the debug-signed APK only. Add the secrets to produce the release APK."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::release secrets not set - building the debug-signed APK only"
            exit 0
          fi
          if [ "$set_count" -ne 4 ]; then
            echo "::error::set all four release secrets (CINEMAXXX_KEYSTORE_BASE64, CINEMAXXX_KEY_ALIAS, CINEMAXXX_KEY_PASS, CINEMAXXX_STORE_PASS) or none"
            exit 1
          fi
          umask 077
          python3 - <<'PYEOF'
          import base64, os
          from pathlib import Path
          key = Path(os.environ["RUNNER_TEMP"]) / "cinemaxxx-release.p12"
          key.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))
          key.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CINEMAXXX_KEYSTORE={key}\n")
              output.write("RELEASE_SIGNING=1\n")
          PYEOF

      - name: Build and sign the debuggable variant
        run: bash android/build.sh --debug

      - name: Verify the debuggable variant
        run: |
          apk=android/dist/cinemaxxx-1.1.0-debug.apk
          [ -f "$apk" ] || { echo "::error::no debug APK was produced"; exit 1; }
          android/.toolchain/bin/aapt2 dump badging "$apk" >/tmp/debug-badging.txt 2>/dev/null || true
          grep -q "^package: name='com.cinemaxxx.app'" /tmp/debug-badging.txt \
            || { echo "::error::the debug APK lost the application id"; cat /tmp/debug-badging.txt; exit 1; }
          grep -q "versionCode='2' versionName='1.1.0'" /tmp/debug-badging.txt \
            || { echo "::error::the debug APK lost the version"; cat /tmp/debug-badging.txt; exit 1; }
          grep -q "^application-debuggable" /tmp/debug-badging.txt \
            || { echo "::error::the debug APK is not debuggable"; cat /tmp/debug-badging.txt; exit 1; }
          android/.toolchain/jdk/bin/java -jar android/.toolchain/lib/apksigner.jar verify "$apk"
          echo "debug APK: $(wc -c <"$apk") bytes, debuggable, same id/version as release"

      - name: Build, sign and verify the release APK
        if: env.RELEASE_SIGNING == '1'
        env:
          CINEMAXXX_KEY_ALIAS: ${{ secrets.CINEMAXXX_KEY_ALIAS }}
          CINEMAXXX_STORE_PASS: ${{ secrets.CINEMAXXX_STORE_PASS }}
          CINEMAXXX_KEY_PASS: ${{ secrets.CINEMAXXX_KEY_PASS }}
        run: bash android/build.sh

      - name: Remove the temporary release key
        if: always()
        run: rm -f "$RUNNER_TEMP/cinemaxxx-release.p12"

      - name: Run the Android test suite
        run: |
          mkdir -p android/build
          if [ "$RELEASE_SIGNING" = "1" ]; then apk=android/dist/cinemaxxx-1.1.0.apk; else apk=android/dist/cinemaxxx-1.1.0-debug.apk; fi
          [ -f "$apk" ] || { echo "::error::the APK under test is missing: $apk"; exit 1; }
          echo "CINEMAXXX_TEST_APK=$PWD/$apk" >> "$GITHUB_ENV"
          CINEMAXXX_TEST_APK="$PWD/$apk" bash android/tests/run-tests.sh --skip-build | tee android/build/test-suite.log

      - name: Verify the test evidence
        run: |
          log=android/build/test-suite.log
          grep -q "All Android checks passed." "$log" \
            || { echo "::error::the Android test suite did not report success"; exit 1; }
          if grep -qE "^[[:space:]]*(SKIP|FAIL)\b" "$log"; then
            echo "::error::a layer was skipped or failed:"
            grep -E "^[[:space:]]*(SKIP|FAIL)\b" "$log"
            exit 1
          fi
          # Every layer must report its own summary. Counting them is not enough
          # (the count moves whenever a layer is added), so each layer is named
          # and the totals are checked for the expected order: JVM, DOM, brand
          # artwork, APK. A missing summary fails the build instead of silently
          # shrinking the suite.
          layers="$(grep -c "checks: " "$log")"
          if [ "$layers" -ne 4 ]; then
            echo "::error::expected a JVM, a DOM, a brand-artwork and an APK check summary - found $layers"
            grep "checks: " "$log" || true
            exit 1
          fi
          for evidence in "PASS unit checks" "PASS DOM behaviour" "PASS brand artwork" "PASS APK structure"; do
            grep -q "$evidence" "$log" \
              || { echo "::error::missing test-layer evidence: $evidence"; exit 1; }
          done
          if grep -qE "failures: [1-9]" "$log"; then
            echo "::error::a layer reported failures"
            grep -E "failures: [1-9]" "$log"
            exit 1
          fi
          {
            echo "### Android checks"
            grep -E "checks: " "$log" | sed 's/^/ - /'
            echo " - APK under test: $(basename "$CINEMAXXX_TEST_APK") ($(wc -c < "$CINEMAXXX_TEST_APK") bytes)"
          } >>"$GITHUB_STEP_SUMMARY"
          grep -E "checks: " "$log"

      - name: Render the splash offline (design preview + smoothness numbers)
        run: bash android/tools/preview-splash.sh | tee android/build/splash-preview.log

      - name: Report the artefact
        run: |
          cd android/dist
          for apk in cinemaxxx-1.1.0.apk cinemaxxx-1.1.0-debug.apk; do
            if [ -f "$apk" ]; then sha256sum "$apk" | tee "$apk.sha256"; fi
          done
          ls -l ./*.apk

      - name: Upload the installable APK
        uses: actions/upload-artifact@v7
        with:
          name: cinemaxxx-android-apk
          path: |
            android/dist/cinemaxxx-1.1.0.apk
            android/dist/cinemaxxx-latest.apk
            android/dist/cinemaxxx-1.1.0.apk.sha256
            android/dist/cinemaxxx-1.1.0-debug.apk
            android/dist/cinemaxxx-1.1.0-debug.apk.sha256
            android/dist/cinemaxxx-latest-debug.apk
            android/build/test-suite.log
            android/build/splash-preview.log
            android/build/preview/*.png
          if-no-files-found: error
          retention-days: 90

  # The website and the app share one codebase: the APK hosts the deployed web
  # app inside a WebView, so a broken typecheck, lint error or production build
  # breaks the app just as surely as a broken APK. This job proves the web side
  # on the same commit. It needs no database: the build is static/prerendered and
  # the data layer only connects at request time.
  web:
    name: Lint, typecheck and production web build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Clean dependency installation
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Verify the brand artwork collection
        run: npm run verify:logos

      - name: Verify the platform registry and its save/read path
        run: npm run verify:platforms

      # What a share carries is decided in src/lib/share.ts and followed by both
      # the website and the app. These checks run that module in a sandbox, so a
      # lost preview card, a claimed-but-absent video or a missing clipboard
      # fallback fails here instead of on a phone.
      - name: Verify the sharing rules
        run: npm run verify:share
        env:
          # The check builds share URLs only; it makes no request to this origin.
          NEXT_PUBLIC_SITE_URL: https://verification.example.invalid

      # The APK the download button hands out is the one this workflow builds;
      # this checks the artifact that is committed for the website, so a broken
      # or stale file cannot be shipped by a green web build.
      - name: Verify the advertised app package
        run: npm run verify:promo

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify the built site uses this deployment's origin
        run: |
          origin="$NEXT_PUBLIC_SITE_URL"
          grep -rq --include=*.html "rel=\"canonical\" href=\"$origin\"" .next/server/app \
            || { echo "::error::the built home page has no canonical URL for $origin"; exit 1; }
          if grep -rqs "cinemax-orpin.vercel.app\|www.cinemaxtv.space" .next/server .next/static; then
            echo "::error::the build still references a retired host"; exit 1
          fi
          echo "built site canonical: $origin"

      # The legal documents are static pages, so their finished HTML exists only
      # after the build. This reads those pages and checks the anchors, the
      # logos, the cross-links and the disclaimers the build cannot verify.
      - name: Verify the legal documents
        run: npm run verify:legal

      - name: Report the client bundle
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, os
          files = sorted(glob.glob(".next/static/chunks/**/*.js", recursive=True))
          total = sum(os.path.getsize(f) for f in files)
          print("### Client JavaScript")
          print(f"- {len(files)} chunks, {total/1024:.0f} KB uncompressed on disk")
          for f in sorted(files, key=os.path.getsize, reverse=True)[:5]:
              print(f"- {os.path.getsize(f)/1024:.0f} KB `{os.path.basename(f)}`")
          PY
